<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <!-- Viewport essencial para app nativo -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>App Financeiro</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body class="   ">
   <!-- 
      Esqueleto principal do App (Mobile-First)
    -->
    <div class="app-container">

        <!-- 
          Área de Conteúdo Dinâmico
        -->
        <main id="dynamic-content" class="main-content container">
            <!-- O conteúdo da página será carregado aqui -->
        </main>

        <!-- 
          Barra de Navegação Inferior
        -->
        <nav class="bottom-nav">
            <div class="container nav-button-container">

                <!-- Botão 1: Home (Ativo por padrão) -->
                <!-- A classe 'active' será gerenciada pelo JS -->
                <button class="nav-button" onclick="navigateTo('Home', this)">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1V9a1 1 0 011-1h2a1 1 0 011 1v10a1 1 0 001 1h3m-6 0V9"></path>
                    </svg>
                    <span class="nav-text">Home</span>
                </button>

                <!-- Botão 2: Buscar -->
                <button class="nav-button" onclick="navigateTo('Buscar', this)">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <span class="nav-text">Buscar</span>
                </button>
                
                <!-- Botão 3: Perfil -->
                <button class="nav-button" onclick="navigateTo('Perfil', this)">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="nav-text">Perfil</span>
                </button>
                
                <!-- Botão 4: Ajustes -->
                <!-- <button class="nav-button" onclick="navigateTo('Ajustes', this)">
                    <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.096 2.572-1.065z"></path>
                         <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                    <span class="nav-text">Ajustes</span>
                </button> -->

            </div>
        </nav>

    </div>
  <!-- Importa seu JS -->
  <script src="app.js"></script>
     <script>
        const dynamicContent = document.getElementById('dynamic-content');

        // Conteúdo de exemplo para cada página
        const pages = {
            'Home': `
                <h1 class="text-3xl font-bold" style="color: var(--cor-texto);">Página Inicial</h1>
                <p class="mt-2 mb-6" style="color: var(--cor-texto-secundario);">O conteúdo dinâmico da página principal aparece aqui.</p>
                <div class="rounded-lg p-6 shadow-sm" style="background-color: var(--cor-fundo-secundaria); border: 1px solid var(--cor-borda);">
                    <h3 class="text-xl font-semibold mb-2" style="color: var(--cor-texto);">Seu Conteúdo</h3>
                    <p style="color: var(--cor-texto-secundario);">Este é um card de exemplo na página inicial.</p>
                </div>
                <div class="rounded-lg p-6 shadow-sm mt-4" style="background-color: var(--cor-fundo-secundaria); border: 1px solid var(--cor-borda);">
                    <h3 class="text-xl font-semibold mb-2" style="color: var(--cor-texto);">Outro Card</h3>
                    <p style="color: var(--cor-texto-secundario);">Mais conteúdo para preencher a página.</p>
                </div>`,
            'Buscar': `
                <h1 class="text-3xl font-bold" style="color: var(--cor-texto);">Buscar</h1>
                <p class="mt-2 mb-6" style="color: var(--cor-texto-secundario);">Aqui você pode adicionar um campo de busca.</p>
                <input type="text" placeholder="Digite sua busca..." 
                       class="w-full p-3 rounded-lg border" 
                       style="background-color: var(--cor-fundo-secundaria); border-color: var(--cor-borda); color: var(--cor-texto);">
                `,
            'Perfil': `
                <h1 class="text-3xl font-bold" style="color: var(--cor-texto);">Meu Perfil</h1>
                <p class="mt-2" style="color: var(--cor-texto-secundario);">Informações do usuário e configurações de conta.</p>`,
             
        };

        function navigateTo(pageName, clickedButton) {
            // 1. Atualiza o conteúdo dinâmico
            dynamicContent.innerHTML = pages[pageName] || `<h1 class="text-3xl font-bold">Página não encontrada</h1>`;

            // 2. Reseta todos os botões para o estado inativo
            const buttons = document.querySelectorAll('.nav-button');
            buttons.forEach(button => {
                const icon = button.querySelector('.nav-icon');
                const text = button.querySelector('.nav-text');
                icon.style.color = 'var(--cor-texto-secundario)';
                text.style.color = 'var(--cor-texto-secundario)';
            });

            // 3. Ativa o botão clicado
            const activeIcon = clickedButton.querySelector('.nav-icon');
            const activeText = clickedButton.querySelector('.nav-text');
            activeIcon.style.color = 'var(--cor-primaria)';
            activeText.style.color = 'var(--cor-primaria)';
        }

        // Carrega a página inicial por padrão quando o DOM estiver pronto
        document.addEventListener('DOMContentLoaded', () => {
            // Encontra o primeiro botão (Home) e o define como ativo
            const homeButton = document.querySelector('.nav-button'); 
            if(homeButton) {
                navigateTo('Home', homeButton);
            }
        });
    </script>
</body>
</html>
